plugins {
    id 'fabric-loom'
    id 'io.github.flemmli97.multiloader.common-convention'
}

base {
    archivesName = rootProject.api_mod_id
}
version = "${project.minecraft_version}-${rootProject.api_version}-fabric"

loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            vmArgs '-Dmixin.debug.export=true'
        }
        server {
            server()
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly(project(':common-api'))
    compileOnly(project(path: ':common-api', configuration: 'commonDependency'))

    modImplementation include("io.github.flemmli97:lingua_bib:${lingua_bib}-fabric")
}

processResources {
    from(project(":common-api").sourceSets.main.resources)
    exclude '**/accesstransformer.cfg'
}

tasks.named('compileJava', JavaCompile) {
    source(project(":common-api").sourceSets.main.allSource)
}

tasks.named('sourcesJar', Jar) {
    from(project(":common-api").sourceSets.main.allSource)
    exclude '.cache'
}

tasks.register('cleanLocalPublish') {
    group = 'publishing'
    dependsOn ':common-api:clean', clean, publishToMavenLocal
    publishToMavenLocal.mustRunAfter ':common-api:clean', clean
}

tasks.register('cleanPublish') {
    group = 'publishing'
    dependsOn ':common-api:clean', clean, publish
    publish.mustRunAfter ':common-api:clean', clean
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from(components["java"])
            artifactId = api_mod_id
            suppressPomMetadataWarningsFor("runtimeElements")
        }
    }
}