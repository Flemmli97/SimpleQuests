plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.107' apply false
    id 'io.github.flemmli97.multiloader.discord_hook' version '1.+'
}

subprojects {
    repositories {
        mavenLocal()
        maven {
            name = "LinguaBib"
            url = "https://maven.blazing-coop.net/releases"
            content {
                includeGroup 'io.github.flemmli97'
            }
        }
        maven {
            name = "FTB"
            url = "https://maven.ftb.dev/releases"
            content {
                includeGroup 'dev.ftb.mods'
            }
        }
        maven {
            name = "Architectury"
            url = "https://maven.architectury.dev/"
            content {
                includeGroup 'dev.architectury'
            }
        }
    }
}

tasks.register("publishAPI") {
    group = 'publishing'
    var clean = [":common-api:clean", ":fabric-api:clean", ":neoforge-api:clean"]
    dependsOn clean
    var publish = [":common-api:publish", ":fabric-api:publish", ":neoforge-api:publish"]
    publish.each { tasks.findByPath(it).mustRunAfter clean }
    dependsOn publish
}