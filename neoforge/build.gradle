apply from: "https://raw.githubusercontent.com/Flemmli97/GradleScripts/arch-loom-v2/neoforge.gradle"

loom {
    runs {
        data {
            data()
            programArgs "--all", "--mod", "simplequests"
            programArgs "--output", project(":common").file("src/generated/resources").absolutePath
            property("ExampleGenPath", project.rootProject.file("Example-Datapack/Datapack").absolutePath)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "FTB"
        url = "https://maven.saps.dev/minecraft"
    }
    maven {
        name = "LinguaBib"
        url "https://gitlab.com/api/v4/projects/21830712/packages/maven"
    }
}

dependencies {
    modCompileOnly("dev.ftb.mods:ftb-ranks-neoforge:${ftb_ranks}")

    modImplementation include("io.github.flemmli97:lingua_bib:${lingua_bib}-neoforge")
}

shadowJar {
    exclude "**/forge/test/**"
}