ext {
    shadow_dep = [group: "com.github.johnrengelman.shadow", name: "com.github.johnrengelman.shadow.gradle.plugin", version: "7.1.0"]
}

apply from: "https://raw.githubusercontent.com/Flemmli97/GradleScripts/mc-architectury-v1/forge.gradle"

loom {
    forge {
        mixinConfigs = ["simplequests.mixins.json"]
    }
    runs {
        data {
            data()
            programArgs "--all", "--mod", "simplequests"
            programArgs "--output", project(":common").file("src/generated/resources").absolutePath
            property("ExampleGenPath", project.rootProject.file("Example-Datapack/Datapack").absolutePath)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "FTB"
        url = "https://maven.saps.dev/minecraft"
    }
    maven {
        name = "LinguaBib"
        url "https://gitlab.com/api/v4/projects/21830712/packages/maven"
    }
}

configurations {
    apiLib
//    runtimeClasspath.extendsFrom apiLib
    developmentForge.extendsFrom apiLib
}

dependencies {
    modCompileOnly("dev.ftb.mods:ftb-ranks-forge:${ftb_ranks}")

//    compileOnly(include(project(path: ":forge-api")))
//
//    developmentForge(project(path: ":common-api")) { transitive = false}
//    implementation(project(path: ":forge-api", configuration: "namedElements"))
    apiLib(project(path: ":common-api", configuration: "namedElements")) { transitive = false }
    apiLib(project(path: ":forge-api", configuration: "namedElements")) { transitive = false }
    compileOnly(include(project(path: ":forge-api")))
}

shadowJar {
    exclude "**/forge/test/**"
}